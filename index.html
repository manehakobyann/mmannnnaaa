<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE LAST MESSAGE — Interactive Mystery</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --red:#b71925;
  --red2:#e33a45;
  --cream:#ddd7ca;
  --dark:#08090b;
  --panel:#111317;
  --line:rgba(255,255,255,.12);
  --muted:#858991;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050608;
  color:white;
  font-family:"IBM Plex Mono",monospace;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
}

#game{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:#050608;
}

/* =========================================================
   GLOBAL ATMOSPHERE
========================================================= */

.grain{
  pointer-events:none;
  position:fixed;
  inset:-50%;
  z-index:100;
  opacity:.075;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation:grain .18s steps(2) infinite;
}

@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(2%,1%)}
  50%{transform:translate(-1%,2%)}
  75%{transform:translate(1%,-2%)}
  100%{transform:translate(-2%,0)}
}

.vignette{
  pointer-events:none;
  position:fixed;
  inset:0;
  z-index:90;
  background:
    radial-gradient(circle at center,
      transparent 35%,
      rgba(0,0,0,.28) 65%,
      rgba(0,0,0,.82) 100%);
}

#rain{
  pointer-events:none;
  position:absolute;
  inset:0;
  z-index:80;
  opacity:.38;
  overflow:hidden;
}

.drop{
  position:absolute;
  width:1px;
  height:80px;
  background:linear-gradient(transparent,rgba(180,205,220,.55));
  transform:rotate(14deg);
  animation:rain linear infinite;
}

@keyframes rain{
  from{transform:translateY(-120px) rotate(14deg)}
  to{transform:translateY(110vh) rotate(14deg)}
}

/* =========================================================
   TOP HUD
========================================================= */

#hud{
  position:absolute;
  top:24px;
  left:28px;
  right:28px;
  z-index:120;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.hud-left{
  display:flex;
  gap:14px;
  align-items:center;
}

.case-number{
  font-size:10px;
  letter-spacing:4px;
  color:#777b82;
}

.clue-counter{
  font-size:10px;
  letter-spacing:2px;
  color:#c8c4bb;
}

.hud-right{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.lang{
  border:1px solid var(--line);
  background:rgba(5,6,8,.55);
  padding:8px 11px;
  font-size:10px;
  letter-spacing:2px;
  transition:.25s;
}

.lang:hover{
  border-color:#aaa;
  background:#15171b;
}

.lang.active{
  color:white;
  border-color:var(--red);
}

/* =========================================================
   INTRO
========================================================= */

#intro{
  position:absolute;
  inset:0;
  z-index:200;
  background:#020304;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 1.5s ease,visibility 1.5s;
}

#intro.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-content{
  width:min(800px,88%);
  text-align:center;
}

.intro-case{
  color:#777;
  letter-spacing:7px;
  font-size:10px;
  margin-bottom:30px;
}

.intro-title{
  font-family:"Playfair Display",serif;
  font-size:clamp(48px,9vw,110px);
  letter-spacing:5px;
  font-weight:500;
  line-height:.95;
  margin-bottom:34px;
}

.intro-line{
  width:0;
  height:1px;
  background:#aaa;
  margin:0 auto 28px;
  animation:introLine 2s 1s forwards;
}

@keyframes introLine{
  to{width:220px}
}

.intro-text{
  color:#aaa;
  font-size:12px;
  line-height:2;
  max-width:620px;
  margin:auto;
  min-height:72px;
}

.enter{
  margin-top:40px;
  padding:15px 30px;
  border:1px solid rgba(255,255,255,.25);
  background:transparent;
  letter-spacing:4px;
  font-size:10px;
  transition:.3s;
}

.enter:hover{
  background:#fff;
  color:#000;
}

/* =========================================================
   PHONE CALL
========================================================= */

#callScene{
  position:absolute;
  inset:0;
  z-index:180;
  background:#020204;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 1s,visibility 1s;
}

#callScene.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.call-phone{
  width:250px;
  height:500px;
  border:8px solid #22252b;
  border-radius:38px;
  background:#050608;
  box-shadow:
    0 0 80px rgba(255,255,255,.04),
    inset 0 0 20px rgba(255,255,255,.03);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  animation:phoneShake .18s infinite;
}

@keyframes phoneShake{
  0%,100%{transform:rotate(0)}
  50%{transform:rotate(.7deg)}
}

.phone-screen{
  width:calc(100% - 18px);
  height:calc(100% - 18px);
  border-radius:29px;
  background:
    radial-gradient(circle at 50% 20%,#24282e,#08090c 50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:75px;
}

.incoming{
  color:#777;
  font-size:9px;
  letter-spacing:3px;
  margin-bottom:16px;
}

.caller{
  font-size:21px;
  margin-bottom:45px;
}

.call-icon{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#171a1f;
  border:1px solid #343840;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{box-shadow:0 0 35px rgba(255,255,255,.12)}
}

.answer{
  position:absolute;
  bottom:65px;
  border:1px solid #555;
  background:transparent;
  padding:12px 24px;
  font-size:9px;
  letter-spacing:3px;
}

.answer:hover{
  background:white;
  color:black;
}

/* =========================================================
   MAIN ROOM
========================================================= */

#world{
  position:absolute;
  inset:0;
  opacity:0;
  transform:scale(1.03);
  transition:opacity 1.3s,transform 2s;
}

#world.visible{
  opacity:1;
  transform:scale(1);
}

.room{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(180deg,#111317 0%,#0c0e11 55%,#08090a 100%);
}

/* wall */

.wall{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:67%;
  background:
    radial-gradient(circle at 25% 20%,rgba(100,105,110,.07),transparent 28%),
    linear-gradient(90deg,#16191d,#101216 60%,#14171b);
}

/* floor */

.floor{
  position:absolute;
  left:-10%;
  bottom:-20%;
  width:120%;
  height:48%;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.025) 0 2px,
      transparent 2px 120px
    ),
    linear-gradient(180deg,#111214,#060708);
  transform:perspective(600px) rotateX(45deg);
  transform-origin:center top;
}

/* window */

.window{
  position:absolute;
  width:min(31vw,400px);
  height:min(48vh,500px);
  top:12%;
  right:10%;
  border:12px solid #24272c;
  background:
    linear-gradient(90deg,transparent 49%,rgba(255,255,255,.08) 50%,transparent 51%),
    linear-gradient(180deg,transparent 49%,rgba(255,255,255,.08) 50%,transparent 51%),
    linear-gradient(180deg,#111827,#070a0e);
  box-shadow:0 0 40px rgba(0,0,0,.6);
  overflow:hidden;
  cursor:pointer;
}

.window:hover{
  border-color:#454951;
}

.city{
  position:absolute;
  bottom:0;
  width:100%;
  height:45%;
  background:
    linear-gradient(90deg,
      #060708 0 10%,
      #15181d 10% 17%,
      #050608 17% 28%,
      #181b20 28% 42%,
      #07080a 42% 52%,
      #191c21 52% 69%,
      #050608 69% 80%,
      #14171c 80% 100%);
}

.lightning{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
}

.window.flash .lightning{
  animation:lightning .45s;
}

@keyframes lightning{
  0%,100%{opacity:0}
  15%{opacity:.75}
  20%{opacity:0}
  40%{opacity:.5}
  45%{opacity:0}
}

.silhouette{
  position:absolute;
  bottom:14%;
  left:49%;
  width:35px;
  height:110px;
  opacity:0;
  background:#020304;
  clip-path:polygon(40% 0,62% 0,72% 17%,100% 35%,82% 39%,75% 100%,25% 100%,18% 39%,0 35%,28% 17%);
  transition:.4s;
}

.window.reveal .silhouette{
  opacity:.85;
}

/* lamp */

.lamp{
  position:absolute;
  left:17%;
  bottom:27%;
  width:130px;
  height:210px;
  cursor:pointer;
}

.lamp-shade{
  position:absolute;
  top:0;
  left:15px;
  width:100px;
  height:65px;
  background:#34363a;
  clip-path:polygon(17% 0,83% 0,100% 100%,0 100%);
  border-bottom:3px solid #8c7d65;
}

.lamp-stem{
  position:absolute;
  width:8px;
  height:120px;
  left:61px;
  top:62px;
  background:#303238;
}

.lamp-base{
  position:absolute;
  bottom:0;
  left:30px;
  width:70px;
  height:15px;
  border-radius:50%;
  background:#2a2c30;
}

.lamp-glow{
  position:absolute;
  top:-70px;
  left:-45px;
  width:220px;
  height:220px;
  background:radial-gradient(circle,rgba(190,145,75,.32),transparent 65%);
  opacity:0;
  transition:.5s;
  pointer-events:none;
}

.lamp.on .lamp-glow{
  opacity:1;
}

.lamp.on .lamp-shade{
  background:#b18b55;
  box-shadow:0 -5px 30px rgba(215,165,83,.3);
}

/* table */

.table{
  position:absolute;
  bottom:18%;
  left:38%;
  width:300px;
  height:28px;
  background:#25272b;
  box-shadow:0 8px 15px rgba(0,0,0,.4);
}

.table:before,
.table:after{
  content:"";
  position:absolute;
  top:20px;
  width:18px;
  height:150px;
  background:#17191c;
}

.table:before{left:25px}
.table:after{right:25px}

/* laptop */

.laptop{
  position:absolute;
  left:48%;
  bottom:24%;
  width:170px;
  height:110px;
  cursor:pointer;
  transition:.3s;
}

.laptop-screen{
  position:absolute;
  left:0;
  top:0;
  width:170px;
  height:95px;
  background:#080b0d;
  border:7px solid #272a2f;
  border-radius:7px 7px 2px 2px;
  transform-origin:bottom;
  transform:rotateX(-8deg);
  transition:.7s;
  overflow:hidden;
}

.laptop-screen-content{
  padding:12px;
  color:#65717c;
  font-size:6px;
  line-height:1.8;
  opacity:.4;
}

.laptop-base{
  position:absolute;
  bottom:0;
  left:-15px;
  width:200px;
  height:15px;
  background:#292c30;
  clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);
}

.laptop.open .laptop-screen{
  transform:rotateX(-30deg);
}

.laptop:hover{
  transform:translateY(-4px);
}

/* picture */

.picture{
  position:absolute;
  top:19%;
  left:16%;
  width:125px;
  height:155px;
  border:10px solid #25272a;
  background:#141619;
  transform:rotate(-2deg);
  cursor:pointer;
  transition:.5s;
}

.picture:hover{
  transform:rotate(-2deg) scale(1.04);
}

.picture-inner{
  position:absolute;
  inset:10px;
  background:
    radial-gradient(circle at 48% 37%,#777 0 9%,transparent 10%),
    linear-gradient(140deg,#25282c,#090a0c);
}

.picture-note{
  position:absolute;
  inset:10px;
  background:#d6d0bf;
  color:#111;
  padding:15px;
  font-size:9px;
  line-height:1.8;
  opacity:0;
  transform:rotateY(180deg);
  backface-visibility:hidden;
  transition:.8s;
}

.picture.flipped .picture-inner{
  opacity:0;
}

.picture.flipped .picture-note{
  opacity:1;
  transform:rotateY(0);
}

/* suitcase */

.suitcase{
  position:absolute;
  left:27%;
  bottom:10%;
  width:190px;
  height:110px;
  cursor:pointer;
  perspective:500px;
}

.case-bottom{
  position:absolute;
  bottom:0;
  width:190px;
  height:70px;
  background:#29221d;
  border:4px solid #46372c;
  border-radius:8px;
}

.case-top{
  position:absolute;
  top:0;
  width:190px;
  height:70px;
  background:#332a24;
  border:4px solid #46372c;
  border-radius:8px;
  transform-origin:bottom;
  transition:.8s;
}

.suitcase.open .case-top{
  transform:rotateX(-105deg);
}

.handle{
  position:absolute;
  top:-14px;
  left:70px;
  width:50px;
  height:25px;
  border:4px solid #4c3c2f;
  border-bottom:0;
  border-radius:8px 8px 0 0;
}

/* door */

.door{
  position:absolute;
  left:4%;
  top:8%;
  width:160px;
  height:67%;
  background:linear-gradient(90deg,#17191c,#202328);
  border:8px solid #292c31;
  cursor:pointer;
}

.door-handle{
  position:absolute;
  right:20px;
  top:50%;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#9a815c;
}

.door:hover{
  filter:brightness(1.15);
}

/* breaker */

.breaker{
  position:absolute;
  left:5.5%;
  top:22%;
  width:105px;
  height:145px;
  background:#25282c;
  border:4px solid #3a3d41;
  opacity:0;
  pointer-events:none;
  transform:translateX(-15px);
  transition:.5s;
}

.breaker.visible{
  opacity:1;
  pointer-events:auto;
  transform:none;
}

.switch{
  position:absolute;
  width:14px;
  height:30px;
  background:#111;
  border:2px solid #666;
  cursor:pointer;
}

.switch:nth-child(1){left:20px;top:25px}
.switch:nth-child(2){left:45px;top:25px}
.switch:nth-child(3){left:70px;top:25px}
.switch:nth-child(4){left:20px;top:75px}
.switch:nth-child(5){left:45px;top:75px}
.switch:nth-child(6){left:70px;top:75px}

.switch.on{
  background:#b7a06c;
  box-shadow:0 0 12px rgba(220,180,100,.4);
}

/* =========================================================
   INTERACTION HINT
========================================================= */

.interactive{
  position:relative;
}

.interactive:after{
  content:"";
  position:absolute;
  inset:-10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  opacity:0;
  transition:.3s;
  pointer-events:none;
}

.interactive:hover:after{
  opacity:1;
}

/* =========================================================
   RETURN BUTTON
========================================================= */

#returnBtn{
  position:absolute;
  left:28px;
  bottom:28px;
  z-index:150;
  display:none;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(5,6,8,.65);
  backdrop-filter:blur(8px);
  padding:12px 17px;
  letter-spacing:3px;
  font-size:9px;
  transition:.3s;
}

#returnBtn.visible{
  display:block;
}

#returnBtn:hover{
  background:#fff;
  color:#000;
}

/* =========================================================
   CLOSE-UP WORLD
========================================================= */

#focus{
  position:absolute;
  inset:0;
  z-index:140;
  pointer-events:none;
  opacity:0;
  background:#050608;
  transition:opacity .7s;
}

#focus.active{
  opacity:1;
  pointer-events:auto;
}

.focus-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* phone */

.big-phone{
  width:340px;
  height:650px;
  border:12px solid #292c32;
  border-radius:48px;
  background:#050607;
  box-shadow:0 0 80px rgba(0,0,0,.8);
  overflow:hidden;
  transform:translateY(30px);
  animation:focusIn .7s forwards;
}

@keyframes focusIn{
  to{transform:none}
}

.big-phone-screen{
  position:absolute;
  inset:10px;
  border-radius:36px;
  background:#0a0d10;
  overflow:hidden;
  padding:55px 25px 30px;
}

.phone-time{
  text-align:center;
  color:#8c9299;
  font-size:10px;
  margin-bottom:35px;
}

.message{
  background:#1b2026;
  border-radius:16px 16px 16px 4px;
  padding:17px;
  font-size:11px;
  line-height:1.9;
  color:#d7d9db;
  margin-bottom:15px;
}

.message small{
  display:block;
  color:#666d74;
  margin-top:8px;
  font-size:8px;
}

/* laptop focus */

.big-laptop{
  width:min(850px,85vw);
  height:500px;
  position:relative;
}

.big-monitor{
  width:100%;
  height:420px;
  background:#0b1013;
  border:15px solid #24282c;
  border-radius:15px;
  box-shadow:0 30px 70px #000;
  padding:40px;
  overflow:hidden;
}

.monitor-line{
  width:70%;
  height:1px;
  background:#394047;
  margin-bottom:30px;
}

.monitor-text{
  color:#83919b;
  font-size:11px;
  line-height:2.2;
  white-space:pre-line;
}

.monitor-secret{
  margin-top:30px;
  color:#d5c39d;
  font-size:14px;
  opacity:0;
  transition:1s;
}

.monitor-secret.show{
  opacity:1;
}

.keyboard{
  width:90%;
  height:45px;
  margin:auto;
  background:#202327;
  clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);
}

/* breaker focus */

.big-breaker{
  width:360px;
  height:500px;
  background:#22262a;
  border:10px solid #383d42;
  box-shadow:0 30px 80px #000;
  padding:45px;
  position:relative;
}

.big-switch{
  width:42px;
  height:80px;
  background:#090a0c;
  border:3px solid #62666b;
  position:absolute;
  cursor:pointer;
}

.big-switch:nth-child(1){left:70px;top:110px}
.big-switch:nth-child(2){left:160px;top:110px}
.big-switch:nth-child(3){left:250px;top:110px}
.big-switch:nth-child(4){left:70px;top:250px}
.big-switch:nth-child(5){left:160px;top:250px}
.big-switch:nth-child(6){left:250px;top:250px}

.big-switch.active{
  background:#b99a63;
  box-shadow:0 0 25px rgba(185,154,99,.4);
}

/* photo focus */

.big-photo{
  width:650px;
  height:450px;
  background:#d2c8b4;
  padding:25px;
  transform:rotate(-2deg);
  box-shadow:0 40px 80px #000;
}

.photo-image{
  height:100%;
  background:
    radial-gradient(circle at 50% 38%,#555 0 9%,transparent 10%),
    linear-gradient(145deg,#34383c,#121416);
  position:relative;
}

.photo-writing{
  position:absolute;
  bottom:20px;
  right:20px;
  color:#111;
  font-size:18px;
  background:#ded4bd;
  padding:12px 18px;
  transform:rotate(-5deg);
}

/* =========================================================
   SUITCASE FOCUS
========================================================= */

.suitcase-inside{
  width:min(720px,85vw);
  height:430px;
  background:#30271f;
  border:10px solid #4a392c;
  box-shadow:0 40px 80px #000;
  padding:40px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  position:relative;
}

.evidence-paper{
  background:#d8d0bd;
  color:#161616;
  padding:22px;
  font-size:10px;
  line-height:1.9;
  transform:rotate(-2deg);
}

.evidence-paper:nth-child(2){
  transform:rotate(2deg);
}

/* =========================================================
   DOOR FOCUS
========================================================= */

.door-focus{
  width:500px;
  height:700px;
  background:linear-gradient(90deg,#16181b,#22252a);
  border:12px solid #30343a;
  box-shadow:0 40px 100px #000;
  position:relative;
}

.lock{
  position:absolute;
  right:60px;
  top:50%;
  width:80px;
  height:80px;
  border:3px solid #887351;
  border-radius:50%;
}

.lock-code{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:230px;
  background:#0c0e11;
  border:1px solid #45494f;

function updateLanguage(){

  document.documentElement.lang = lang === "hy" ? "hy" : "en";

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.dataset.i18n;
    if(translations[lang][key]){
      el.textContent = translations[lang][key];
    }
  });

  document.getElementById("introText").textContent = t("intro");

  if(state.currentFocus){
    renderFocus(state.currentFocus);
  }

  if(state.endingShown){
    document.getElementById("endingText").textContent = t("ending");
  }

  document.getElementById("enBtn").classList.toggle("active",lang==="en");
  document.getElementById("hyBtn").classList.toggle("active",lang==="hy");
}

  lang="en";

function createRain(){

  const rain = document.getElementById("rain");

  for(let i=0;i<90;i++){

    const d=document.createElement("div");

    d.className="drop";

    d.style.left=Math.random()*100+"%";
    d.style.animationDuration=(.45+Math.random()*.7)+"s";
    d.style.animationDelay=(-Math.random()*2)+"s";
    d.style.opacity=.15+Math.random()*.5;

    rain.appendChild(d);
  }
}

createRain();


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let master=null;

function startAudio(){

  if(audioCtx) return;

  audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  master=audioCtx.createGain();
  master.gain.value=.08;
  master.connect(audioCtx.destination);

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sine";
  osc.frequency.value=42;
  gain.gain.value=.35;

  osc.connect(gain);
  gain.connect(master);

  osc.start();

  createRainSound();
}

function createRainSound(){

  const bufferSize=audioCtx.sampleRate*2;
  const buffer=audioCtx.createBuffer(
    1,
    bufferSize,
    audioCtx.sampleRate
  );

  const data=buffer.getChannelData(0);

  for(let i=0;i<bufferSize;i++){
    data[i]=(Math.random()*2-1)*.25;
  }

  const source=audioCtx.createBufferSource();
  source.buffer=buffer;
  source.loop=true;

  const filter=audioCtx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=1500;

  const gain=audioCtx.createGain();
  gain.gain.value=.13;

  source.connect(filter);
  filter.connect(gain);
  gain.connect(master);

  source.start();
}

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);

  u.lang=lang==="hy" ? "hy-AM" : "en-US";
  u.rate=.85;
  u.pitch=.65;
  u.volume=.7;

  speechSynthesis.speak(u);
}

  if(type==="door"){

    focusContent.innerHTML=`

      <div class="door-focus">

        <div class="lock"></div>

        <div class="lock-code">

          <div class="code-display" id="codeDisplay">
            • • • •
          </div>

          <div class="code-buttons">

            ${[1,2,3,4,5,6,7,8,9,0]
              .map(n=>`
                <button onclick="enterCode(${n})">
                  ${n}
                </button>
              `).join("")}

            <button onclick="clearCode()">C</button>

          </div>

          <div class="code-result" id="codeResult"></div>

        </div>

      </div>

    `;

  }


  if(type==="breaker"){

    focusContent.innerHTML=`

      <div class="big-breaker">

        <div class="big-switch" onclick="breakerSwitch(this)"></div>
        <div class="big-switch" onclick="breakerSwitch(this)"></div>
        <div class="big-switch" onclick="breakerSwitch(this)"></div>
        <div class="big-switch" onclick="breakerSwitch(this)"></div>
        <div class="big-switch" onclick="breakerSwitch(this)"></div>
        <div class="big-switch" onclick="breakerSwitch(this)"></div>

      </div>

    `;

  }

}


/* =========================================================
   OBJECT INTERACTIONS
========================================================= */


/* PHONE — after call, phone can be revisited
   through the room only if the player returns later.
*/

document.getElementById("lamp").onclick=()=>{

  const lamp=document.getElementById("lamp");

  lamp.classList.toggle("on");

  if(lamp.classList.contains("on")){

    document.getElementById("breaker").classList.add("visible");

  }

};


/* WINDOW */

document.getElementById("window").onclick=()=>{

  const w=document.getElementById("window");

  w.classList.add("flash");

  setTimeout(()=>w.classList.remove("flash"),500);

  openFocus("window");

};


/* PICTURE */

document.getElementById("picture").onclick=()=>{

  const p=document.getElementById("picture");

  p.classList.toggle("flipped");

  openFocus("picture");

};


/* LAPTOP */

document.getElementById("laptop").onclick=()=>{

  const laptop=document.getElementById("laptop");

  laptop.classList.add("open");

  openFocus("laptop");

};


/* SUITCASE */

document.getElementById("suitcase").onclick=()=>{

  const suitcase=document.getElementById("suitcase");

  suitcase.classList.add("open");

  openFocus("suitcase");

};


/* DOOR */

document.getElementById("door").onclick=()=>{

  openFocus("door");

};


/* =========================================================
   BREAKER
========================================================= */

function breakerSwitch(el){

  el.classList.toggle("active");

  const active=
    document.querySelectorAll(".big-switch.active").length;

  if(active>=4){

    state.breakerSolved=true;

    discoverClue("power");

    document.getElementById("codeResult")?.remove();

    setTimeout(()=>{

      closeFocus();

      document.getElementById("lamp")
        .classList.add("on");

      document.getElementById("breaker")
        .classList.remove("visible");

    },700);

  }

}


/* =========================================================
   DOOR CODE
========================================================= */

let code="";

function enterCode(number){

  if(code.length>=4) return;

  code+=number;

  const display=document.getElementById("codeDisplay");

  if(display){

    display.textContent=
      code.split("")
      .map(()=> "•")
      .join(" ");

  }

  if(code.length===4){

    setTimeout(checkCode,250);

  }

}

function clearCode(){

  code="";

  const display=document.getElementById("codeDisplay");

  if(display){
    display.textContent="• • • •";
  }

}

function checkCode(){

  const result=document.getElementById("codeResult");

  /*
    The photograph gives 23-11-47.
    The relevant four digits are 1147.
  */

  if(code==="1147"){

    result.textContent=
      lang==="en"
      ? "LOCK ACCEPTED."
      : "ԿՈԴԸ ՃԻՇՏ Է։";

    discoverClue("door");

    setTimeout(()=>{

      closeFocus();

      showEnding();

    },1000);

  }else{

    result.textContent=
      lang==="en"
      ? "WRONG CODE."
      : "ՍԽԱԼ ԿՈԴ։";

    setTimeout(clearCode,700);

  }

}


/* =========================================================
   ENDING
========================================================= */

function showEnding(){

  if(state.endingShown) return;

  state.endingShown=true;

  document.getElementById("endingText").textContent=t("ending");

  document.getElementById("ending").classList.add("show");

}


/* =========================================================
   KEYBOARD ESC = RETURN
========================================================= */

document.addEventListener("keydown",e=>{

  if(e.key==="Escape" && state.currentFocus){

    closeFocus();

  }

});


/* =========================================================
   INITIAL LANGUAGE
========================================================= */

updateLanguage();

</script>
